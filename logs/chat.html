<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>stiff404 Chat Log</title>
  <style>
    body{font-family:Inter,Segoe UI,Roboto,Arial;background:#0f1724;color:#e6eef8;padding:24px}
    .msg{background:linear-gradient(90deg,#0b1220,#071226);padding:12px;border-radius:8px;margin-bottom:12px;box-shadow:0 6px 18px rgba(2,6,23,.6)}
    .meta{font-size:12px;color:#8aa0c4}
    pre{white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>stiff404 Chat Log</h1>
  <div id="entries"></div>
  <script>
    async function load(){
      const res = await fetch('./chat.log');
      const txt = await res.text();
      const lines = txt.trim().split('\n').filter(Boolean);
      const el = document.getElementById('entries');
      for(const l of lines){
        try{
          const o = JSON.parse(l);
          const d = document.createElement('div'); d.className='msg';
          d.innerHTML = `<div class="meta">${o.time} — ${o.from}</div><pre>${o.body}</pre>`;
          el.appendChild(d);
        }catch(e){ }
      }
    }
    load();
  </script>
</body>
</html>
